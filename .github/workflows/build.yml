name: Build All-In-One APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-in-one-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Stage four application modules
        run: bash scripts/stage-modules.sh

      - name: Restore emulator engine cache
        id: engines
        uses: actions/cache@v4
        with:
          path: |
            features/emuhub/src/main/jniLibs/arm64-v8a
            features/emuhub/src/main/assets/PPSSPP
            features/emuhub/src/main/assets/ARMSX2
          key: all-in-one-engines-v2

      - name: Download Libretro and PPSSPP engines
        if: steps.engines.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DEST="features/emuhub/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST" /tmp/cores /tmp/ppsspp-src
          fetch_core() {
            local upstream="$1" output="$2"
            mkdir -p "/tmp/cores/$upstream"
            curl --retry 3 --retry-delay 2 -fL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${upstream}_libretro_android.so.zip" -o "/tmp/cores/$upstream.zip"
            unzip -q "/tmp/cores/$upstream.zip" -d "/tmp/cores/$upstream"
            cp "$(find "/tmp/cores/$upstream" -type f -name '*.so' | head -1)" "$DEST/$output"
          }
          fetch_core mgba libmgba_core.so
          fetch_core fceumm libfceumm_core.so
          fetch_core snes9x libsnes9x_core.so
          fetch_core pcsx_rearmed libpcsx_rearmed_core.so
          fetch_core ppsspp libppsspp_core.so
          curl --retry 3 --retry-delay 2 -fL "https://github.com/hrydgard/ppsspp/archive/refs/tags/v1.20.4.tar.gz" -o /tmp/ppsspp-src.tar.gz
          tar -xzf /tmp/ppsspp-src.tar.gz -C /tmp/ppsspp-src --strip-components=1
          mkdir -p features/emuhub/src/main/assets/PPSSPP
          cp -a /tmp/ppsspp-src/assets/. features/emuhub/src/main/assets/PPSSPP/

      - name: Download verified ARMSX2 runtime
        if: steps.engines.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --repo Ruzakj/emuu-hub --workflow build-armsx2-android.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          mkdir -p /tmp/armsx2-runtime
          gh run download "$RUN_ID" --repo Ruzakj/emuu-hub -n ARMSX2-Android-ARM64-Runtime -D /tmp/armsx2-runtime
          cp -a /tmp/armsx2-runtime/jniLibs/arm64-v8a/. features/emuhub/src/main/jniLibs/arm64-v8a/
          mkdir -p features/emuhub/src/main/assets/ARMSX2
          cp -a /tmp/armsx2-runtime/assets/ARMSX2/. features/emuhub/src/main/assets/ARMSX2/

      - name: Verify staged engines
        run: |
          test -s features/emuhub/src/main/jniLibs/arm64-v8a/libmgba_core.so
          test -s features/emuhub/src/main/jniLibs/arm64-v8a/libfceumm_core.so
          test -s features/emuhub/src/main/jniLibs/arm64-v8a/libsnes9x_core.so
          test -s features/emuhub/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_core.so
          test -s features/emuhub/src/main/jniLibs/arm64-v8a/libppsspp_core.so
          test -s features/emuhub/src/main/jniLibs/arm64-v8a/libemucore_4k.so
          test -s features/emuhub/src/main/assets/ARMSX2/GameIndex.yaml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --build-cache --parallel --stacktrace --no-daemon

      - name: Verify unified APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libemuhost.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libppsspp_core.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libemucore_4k.so'
          unzip -l "$APK" | grep 'assets/vibetube/index.html'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libchdman.so'
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ric-All-In-One-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
